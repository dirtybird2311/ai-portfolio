name: Backfill NAV rows (nightly catch-up + manual)

# Fills in missing days of state/daily_account_nav.csv (paper account) and the real-account files
# (daily_nav_robinhood_*.csv) from the trade log, Yahoo closes and, for any close Yahoo lacks, Alpaca's.
# Runs by itself at 10:30 pm ET and 8 am ET on weekdays so the daily watch no longer needs a hand-run backfill.
# Safe to re-run: existing rows are kept (tick "all" to recompute every day).

on:
  schedule:
    - cron: "30 2 * * 2-6"    # 02:30 UTC = 10:30 pm ET Mon-Fri evenings (after Yahoo has settled)
    - cron: "0 12 * * 2-6"    # 12:00 UTC = 8 am ET: second pass for anything still missing
  workflow_dispatch:
    inputs:
      all:
        description: "recompute every day, not just missing ones"
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: pipeline-state
  cancel-in-progress: false

jobs:
  navfill:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.ref_name }}
      - name: Real-account data (private repo, read with PRIVATE_REPO_TOKEN)
        uses: actions/checkout@v5
        continue-on-error: true       # no token yet: real-account steps skip, the rest runs
        with:
          repository: ${{ github.repository_owner }}/ai-portfolio-private
          token: ${{ secrets.PRIVATE_REPO_TOKEN }}
          path: private
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
      - name: Install (pinned versions)
        run: pip install -r requirements.txt
      - name: Backfill
        env:
          ALPACA_API_KEY_ID: ${{ secrets.ALPACA_API_KEY_ID }}
          ALPACA_API_SECRET_KEY: ${{ secrets.ALPACA_API_SECRET_KEY }}
        run: python -m pipeline.navfill ${{ inputs.all && '--all' || '' }}
      - name: Health check (silent unless something is wrong)
        continue-on-error: true
        env:
          GMAIL_ADDRESS: ${{ secrets.GMAIL_ADDRESS }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          EMAIL_TO: ${{ secrets.EMAIL_TO }}
        run: python -m pipeline.health
      - name: Performance sheet (reports/performance/latest.html)
        continue-on-error: true
        run: python -m pipeline.report
      - name: Save state
        run: |
          git config user.name "portfolio-bot"
          git config user.email "portfolio-bot@users.noreply.github.com"
          git add state reports 2>/dev/null || true
          git diff --cached --quiet || git commit -m "account NAV backfill $(date -u +%F)"
          git pull --rebase --autostash
          git push
      - name: Save real-account data to the private repo
        if: always()
        continue-on-error: true
        run: |
          [ -d private/.git ] || exit 0
          cd private
          git config user.name "portfolio-bot"
          git config user.email "portfolio-bot@users.noreply.github.com"
          git add -A
          git diff --cached --quiet || git commit -q -m "${{ github.workflow }} $(date -u +%F)"
          git pull -q --rebase --autostash && git push -q
