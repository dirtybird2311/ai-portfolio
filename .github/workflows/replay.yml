name: Replay a judge on saved packets (manual)

on:
  workflow_dispatch:
    inputs:
      name:
        description: "opus, twin or council"
        required: true
        default: "opus"
      variant:
        description: "for twin: no_debate | no_news | no_fundamentals | no_catalysts | no_new_inputs"
        required: false
        default: ""
      since:
        description: "only packets on or after this date (YYYY-MM-DD)"
        required: false
        default: ""
      budget:
        description: "spending cap in $"
        required: false
        default: "15"

permissions:
  contents: write

concurrency:
  group: pipeline-state
  cancel-in-progress: false

jobs:
  replay:
    runs-on: ubuntu-24.04
    timeout-minutes: 300
    env:
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}             # council notes (Gemini Flash)
      GEMINI_PAID_API_KEY: ${{ secrets.GEMINI_PAID_API_KEY }}
      GMAIL_ADDRESS: ${{ secrets.GMAIL_ADDRESS }}
      GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
      DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
      EMAIL_TO: ${{ secrets.EMAIL_TO }}
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.ref_name }}   # latest commit at start time, not at queue time (a queued job must see the state the job before it saved)
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
      - name: Install (pinned versions)
        run: pip install -r requirements.txt
      - name: Replay
        run: python -m pipeline.replay ${{ inputs.name }} ${{ inputs.variant }} --budget ${{ inputs.budget }} ${{ inputs.since && format('--since {0}', inputs.since) || '' }}
      - name: Save state
        if: always()
        run: |
          git config user.name "portfolio-bot"
          git config user.email "portfolio-bot@users.noreply.github.com"
          git add state runs 2>/dev/null || true
          git diff --cached --quiet || git commit -m "replay $(date -u +%F)"
          git pull --rebase --autostash
          git push
