name: Look-back (manual)

# Looks back at every rebuild's judged shortlist: which names did well, which inputs lined up with it, and a
# written read by a model. Read-only; saves reports/lookback/latest.md and a dated copy. Tick no_llm for numbers only.

on:
  workflow_dispatch:
    inputs:
      no_llm:
        description: "numbers only (no model call)"
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: pipeline-state
  cancel-in-progress: false

jobs:
  lookback:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.ref_name }}
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
      - name: Install (pinned versions)
        run: pip install -r requirements.txt
      - name: Look-back
        run: python -m pipeline.lookback ${{ inputs.no_llm && '--no-llm' || '' }}
      - name: Save look-back
        run: |
          git config user.name "portfolio-bot"
          git config user.email "portfolio-bot@users.noreply.github.com"
          git add reports 2>/dev/null || true
          git diff --cached --quiet || git commit -m "look-back $(date -u +%F)"
          git pull --rebase --autostash
          git push
