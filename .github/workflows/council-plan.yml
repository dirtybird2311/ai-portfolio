name: Council portfolio (manual)

# Builds, in a sandbox, the portfolio the PM would make from the standard verdicts and from the council verdicts
# for a past rebuild, and adds both to the shadow books. Nothing is traded and the real plan is not touched.
# The rebuild does this itself from now on; this is for rebuilds that ran before the council existed.

on:
  workflow_dispatch:
    inputs:
      date:
        description: "rebuild date (runs/<date>/rebuild)"
        required: true
        default: "2026-11-01"
      snapshot:
        description: "commit whose holdings/macro files to use (the book as it stood before that rebuild's trades)"
        required: false
        default: ""

permissions:
  contents: write

concurrency:
  group: pipeline-state
  cancel-in-progress: false

jobs:
  council:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      GMAIL_ADDRESS: ${{ secrets.GMAIL_ADDRESS }}
      GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
      DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
      EMAIL_TO: ${{ secrets.EMAIL_TO }}
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0               # --snapshot reads state files from an older commit
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
      - name: Install (pinned versions)
        run: pip install -r requirements.txt
      - name: Council portfolio
        env:
          SNAP: ${{ inputs.snapshot }}
        run: python -m pipeline.council_plan ${{ inputs.date }} ${SNAP:+--snapshot "$SNAP"}
      - name: Shadow books
        run: python -c "from pipeline import shadowbooks; shadowbooks.refresh()"
      - name: Save state
        if: always()
        run: |
          git config user.name "portfolio-bot"
          git config user.email "portfolio-bot@users.noreply.github.com"
          git add state runs 2>/dev/null || true
          git diff --cached --quiet || git commit -m "council portfolio ${{ inputs.date }}"
          git pull --rebase --autostash
          git push
